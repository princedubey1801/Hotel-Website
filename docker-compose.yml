services:

  web:
    build: .
    container_name: hotel_web
    ports:
      - "80:80"
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: hotel_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hotel
    ports:
      - "3307:3306"
    volumes:
      - ./hotel.sql:/docker-entrypoint-initdb.d/hotel.sql