name: Deploy Hotel Website

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy latest code
        run: |
          cd ~/Hotel-Website
          git fetch origin master
          git reset --hard origin/master
          sudo docker-compose down
          sudo docker-compose up -d --buildname: Deploy Hotel Website

