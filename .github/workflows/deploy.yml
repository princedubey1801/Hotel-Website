name: Hotel Website CI/CD

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Application
        run: |
          docker compose down
          docker compose up -d --build

      - name: Check Containers
        run: docker ps
